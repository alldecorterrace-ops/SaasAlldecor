name: Application checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
  queue-concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: saas_queue_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Concurrent queue and transactional adapter tests
        env:
          QUEUE_TEST_DATABASE_URL: postgresql://postgres:synthetic-ci-only@127.0.0.1:5432/saas_queue_test
        run: npx tsx scripts/test-queue-concurrency.ts
  backup-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: saas_backup_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install pinned encryption tools and PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .local/recovery-tools
          cd .local/recovery-tools
          curl --fail --location --silent --show-error --output age.tar.gz https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-linux-amd64.tar.gz
          printf '%s\n' 'cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10  age.tar.gz' | sha256sum --check
          tar -xzf age.tar.gz
          curl --fail --location --silent --show-error --output rclone.zip https://github.com/rclone/rclone/releases/download/v1.75.1/rclone-v1.75.1-linux-amd64.zip
          printf '%s\n' '982b5aa772841168f8e380f139e9e787b2a105403e32b94da8676a0e1c0a13ab  rclone.zip' | sha256sum --check
          unzip -q rclone.zip
          if [ ! -x /usr/lib/postgresql/17/bin/pg_dump ]; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client-17
          fi
      - name: Restore an encrypted synthetic database snapshot
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGDATABASE: saas_backup_test
          PGUSER: postgres
          PGPASSWORD: synthetic-ci-only
          PG_DUMP_BIN: /usr/lib/postgresql/17/bin/pg_dump
          PG_DUMPALL_BIN: /usr/lib/postgresql/17/bin/pg_dumpall
          PG_RESTORE_BIN: /usr/lib/postgresql/17/bin/pg_restore
          AGE_BIN: .local/recovery-tools/age/age
          AGE_KEYGEN_BIN: .local/recovery-tools/age/age-keygen
          RCLONE_BIN: .local/recovery-tools/rclone-v1.75.1-linux-amd64/rclone
        run: |
          npx tsx scripts/test-backup-recovery.ts
          npx tsx scripts/test-postgres-recovery.ts
