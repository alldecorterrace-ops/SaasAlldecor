name: SaaS availability
on:
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/check-availability.mjs
      - .github/workflows/availability.yml
permissions:
  contents: read
concurrency:
  group: saas-availability
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check public service without credentials
        env:
          CHECK_BACKUPS: ${{ vars.BACKUP_MONITOR_ENABLED }}
        run: node scripts/check-availability.mjs
